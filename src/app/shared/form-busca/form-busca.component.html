<app-card variant="secundary" class="form-busca">
    <form [formGroup]="formBuscaService.formBusca">
        <div class="flex-container">
            <div class="flex-container">
                <mat-button-toggle-group formControlName="somenteIda" aria-label="Tipo de passagem">
                    <mat-button-toggle [value]="false">IDA E VOLTA</mat-button-toggle>
                    <mat-button-toggle [value]="true">SOMENTE IDA</mat-button-toggle>
                </mat-button-toggle-group>
                <mat-chip-listbox (click)="openDialog()" aria-label="Seleção de passagens">
                    <mat-chip-option selected>1 adulto</mat-chip-option>
                    <mat-chip-option>Econômica</mat-chip-option>
                </mat-chip-listbox>
            </div>
        </div>
        <div class="flex-container flex-container-02">
            <app-dropdown-uf class="teste" label="Origem" matPrefix="flight_takeoff"
                [control]="formBuscaService.obterControle('origem') | formControl">
            </app-dropdown-uf>

            <button mat-icon-button>
                <mat-icon>sync_alt</mat-icon>
            </button>
            <app-dropdown-uf label="Destino" matPrefix="flight_land"
                [control]="formBuscaService.obterControle('destino') | formControl"></app-dropdown-uf>
            <mat-form-field class="teste" appearance="outline">
                <mat-label>Data de ida</mat-label>
                <input matInput [matDatepicker]="ida" formControlName="dataIda" name="dataIda">
                <mat-datepicker-toggle matIconSuffix [for]="ida"></mat-datepicker-toggle>
                <mat-datepicker #ida></mat-datepicker>
                <mat-error *ngIf="formBuscaService.obterControle('dataIda')">
                    Data de ida é obrigatória
                </mat-error>
            </mat-form-field>
            <mat-form-field class="teste" appearance="outline">
                <mat-label>Data de Volta</mat-label>
                <input matInput [matDatepicker]="volta" formControlName="dataVolta" name="dataVolta">
                <mat-datepicker-toggle matIconSuffix [for]="volta"></mat-datepicker-toggle>
                <mat-datepicker #volta></mat-datepicker>
                <mat-error *ngIf="formBuscaService.obterControle('dataVolta')">
                    Data de volta é obrigatória
                </mat-error>
            </mat-form-field>
            <button class="buscar" (click)="buscar()" mat-flat-button color="primary">BUSCAR</button>
        </div>
    </form>
</app-card>
